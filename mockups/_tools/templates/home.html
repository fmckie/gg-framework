<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>Kleio · Home · {{DIRECTION}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="screen-home">
<div class="window">
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="home-top">
    <button class="status" type="button" title="Connection to your host"><span class="status-dot" aria-hidden="true"></span><span class="status-text">Connected to studio-mini</span></button>
    <button class="icon-btn settings" type="button" aria-label="Settings" title="Settings">{{icon:settings}}</button>
  </header>
  <main class="home">
    <div class="mark" role="img" aria-label="Kleio">
      <img class="mark-img" src="assets/kleio-mark.png" alt="" draggable="false">
      <span class="wordmark" aria-hidden="true">KLEIO</span>
    </div>
    <p class="tagline">Talk to your work: chat, code and specialists in one app.</p>
    <nav class="destinations" aria-label="Open">
      <button class="dest is-primary" type="button">{{icon:sparkle}}<span>Kleio</span></button>
      <button class="dest" type="button">{{icon:code}}<span>Code</span></button>
      <button class="dest" type="button">{{icon:specialists}}<span>Specialists</span></button>
    </nav>
    <button class="talk" type="button" title="Talk to Kleio (⌘⇧B)">{{icon:waveform}}<span>Talk to Kleio</span><kbd>⌘⇧B</kbd></button>
  </main>
  <footer class="home-foot"><span class="version">v2.1.3</span></footer>
</div>
</body>
</html>
