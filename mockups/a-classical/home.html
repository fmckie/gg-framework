<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>Kleio · Home · A · Classical editorial</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="screen-home">
<div class="window">
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="home-top">
    <button class="status" type="button" title="Connection to your host"><span class="status-dot" aria-hidden="true"></span><span class="status-text">Connected to studio-mini</span></button>
    <button class="icon-btn settings" type="button" aria-label="Settings" title="Settings"><svg class="i i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <main class="home">
    <div class="mark" role="img" aria-label="Kleio">
      <img class="mark-img" src="assets/kleio-mark.png" alt="" draggable="false">
      <span class="wordmark" aria-hidden="true">KLEIO</span>
    </div>
    <p class="tagline">Talk to your work: chat, code and specialists in one app.</p>
    <nav class="destinations" aria-label="Open">
      <button class="dest is-primary" type="button"><svg class="i i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.8 5.2 3.8 8.2 9 9-5.2.8-8.2 3.8-9 9-.8-5.2-3.8-8.2-9-9 5.2-.8 8.2-3.8 9-9z"/></svg><span>Kleio</span></button>
      <button class="dest" type="button"><svg class="i i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></svg><span>Code</span></button>
      <button class="dest" type="button"><svg class="i i-specialists" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><circle cx="6.5" cy="16.5" r="3.5"/><circle cx="17.5" cy="16.5" r="3.5"/></svg><span>Specialists</span></button>
    </nav>
    <button class="talk" type="button" title="Talk to Kleio (⌘⇧B)"><svg class="i i-waveform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4M8 6.5v11M12 3.5v17M16 7.5v9M20 10.5v3"/></svg><span>Talk to Kleio</span><kbd>⌘⇧B</kbd></button>
  </main>
  <footer class="home-foot"><span class="version">v2.1.3</span></footer>
</div>
