version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Update the pnpm workspace from its root so package manifests and the shared
  # lockfile stay in sync. pnpm-workspace.yaml supplies the member directories;
  # Dependabot does not support updates from workspace subdirectories.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Rust: the Tauri desktop app (gg-app) and Kleio's link and kleio-link-host
  # (packages/kleio-link), each with its own lockfile. gg-app builds the link
  # by path, and the link pins iroh, iroh-relay and noq-proto exactly, so
  # iroh, its sub-crates and noq (noq-* takes in noq-proto) must move together
  # in both lockfiles. One entry lists both directories, so each group below
  # is a single pull request across them: dependabot-core merges a group's
  # changes over an entry's `directories`. The second group does the same for
  # security updates. scripts/check-link-locks.mjs still fails CI if the two
  # lockfiles ever name different iroh or noq versions. Other crates get a
  # pull request each, per directory, as before.
  - package-ecosystem: cargo
    directories:
      - /gg-app/src-tauri
      - /packages/kleio-link
    schedule:
      interval: weekly
    groups:
      iroh:
        patterns: ["iroh", "iroh-*", "noq", "noq-*"]
      iroh-security:
        applies-to: security-updates
        patterns: ["iroh", "iroh-*", "noq", "noq-*"]
